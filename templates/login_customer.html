{% extends "base.html" %}
{% set is_auth = True %}
{% if is_auth %}{% include "partials_footer_auth.html" %}{% endif %}
{% block content %}

<style>
  :root{
    --brand:#166534;            /* أخضر الزر */
    --glass-bg: rgba(255,255,255,.85);
    --ring: rgba(22,101,52,.18);
  }

  html, body { height: 100%; margin: 0; }

  /* خلفية + تمركز مركزي 100% */
  body {
    min-height: 100dvh;
    display: grid;
    place-items: center;
    background:
      linear-gradient(rgba(255,255,255,.75), rgba(255,255,255,.75)),
      url("{{ url_for('static', filename='backg.png') }}") center/cover no-repeat;
    background-attachment: fixed;
  }

  /* غلاف الكارد (لا مارجن نهائياً) */
  .auth-shell { width: 100%; display: grid; place-items: center; }

  .auth-card{
    position: relative;
    width: min(520px, 92vw);
    padding: 26px 22px 20px;
    border-radius: 16px;
    background: var(--glass-bg);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    box-shadow: 0 12px 28px rgba(0,0,0,.12);
  }

  /* شارة اللوقو: نص داخل ونص خارج */
  .logo-badge{
    position: absolute;
    left: 50%;
    top: 0;                          /* على حافة الكارد */
    transform: translate(-50%, -50%);/* نصه برّا */
    width: 72px; height: 72px;
    border-radius: 50%;
    background: #fff;
    display: grid; place-items: center;
    box-shadow: 0 6px 20px rgba(0,0,0,.12);
  }
  .logo-badge img{
    width: 60px; height: 60px; border-radius: 50%;
    display: block;
  }

  h2.title{ text-align:center; margin: 30px 0 14px; }

  /* الحقول أصغر وعرضها مرتب */
  form{ width: min(360px, 88vw); margin: 0 auto; display: grid; gap: 10px; }
  .field{ display:grid; gap:6px; }
  label{ font-size: 13px; color:#6b7280; font-weight:600 }

  input[type="email"], input[type="password"]{
    width: 100%;
    background:#fff;                /* أبيض */
    border:1px solid #e5e7eb;
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 15px;
    outline: none;
    transition: border-color .2s, box-shadow .2s;
  }
  input:focus{
    border-color:#c7e6d5;
    box-shadow: 0 0 0 4px var(--ring);
  }

  .form-buttons{
    display:flex; gap:12px; align-items:center; justify-content:space-between;
    margin-top: 12px;
  }
  .btn-submit{
    background: var(--brand); color:#fff; border:none; cursor:pointer;
    padding:14px 28px; border-radius:12px; font-weight:700;
    box-shadow: 0 8px 20px rgba(22,101,52,.18);
  }
  .btn-submit:hover{ filter:brightness(.95) }
  .btn-back{
    background:#fff; border:1px solid #e5e7eb; color:#444; text-decoration:none;
    padding:14px 28px; border-radius:12px; font-weight:700;
  }
    <style>
  /* غلاف يدفع الفوتر لأسفل الصفحة */
  .page-wrap{min-height:100vh;display:flex;flex-direction:column}
  .auth-main{flex:1;display:grid;place-items:center}

  /* ===== Footer ===== */
  .auth-footer{
    width:100%;
    background:rgba(255,255,255,.88);
    -webkit-backdrop-filter:blur(8px);
    backdrop-filter:blur(8px);
    border-top:1px solid #e5e7eb;
  }
  .auth-footer .wrap{
    max-width:1100px;margin:0 auto;
    padding:16px 20px;
    display:grid;gap:24px;
    grid-template-columns:1fr 1fr 1fr;
    align-items:start;
  }
  .auth-footer h4{margin:0 0 10px;font-size:15px}
  .auth-footer a{display:block;margin:6px 0;text-decoration:none;color:#0f172a}
  .auth-footer a:hover{text-decoration:underline}

  .auth-footer .social{display:flex;gap:12px;margin:8px 0}
  .auth-footer .social a{font-size:18px}

  .auth-footer .copy{display:flex;align-items:center;gap:8px;margin-top:6px;color:#334155}
  .auth-footer .copy img{width:22px;height:22px;border-radius:50%}

  @media (max-width:768px){
    .auth-footer .wrap{grid-template-columns:1fr; text-align:center}
    .auth-footer .copy{justify-content:center}
  }
</style>

 <section class="auth-card glass" style="max-width:560px;margin:64px auto;padding:28px">
  <div class="logo" style="text-align:center;margin-bottom:12px">
    <img src="{{ url_for('static',filename='logonum1.png') }}" alt="logo" style="width:74px;height:74px;border-radius:50%">
  </div>

  <h2 class="title" style="text-align:center;margin:0 0 18px">دخول العملاء</h2>
    <form method="post" novalidate autocomplete="off">
      <div class="field">
        <label>البريد الإلكتروني</label>
        <input type="email" name="email" placeholder="name@example.com">
      </div>

      <div class="field">
        <label>كلمة المرور</label>
        <input type="password" name="password" placeholder="••••••••">
      </div>

     <div class="form-buttons">
        <a href="{{ url_for('auth_choose') }}" class="btn-back">رجوع</a>
        <button type="submit" class="btn-submit">دخول</button>
      </div>
    </form>

    <div class="hint">عميل جديد؟ <a href="{{ url_for('customer_signup') }}">أنشئ حسابًا</a></div>
  </section>
</div>
{% endblock %}
