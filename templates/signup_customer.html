{% extends "base.html" %}
{% set body_class = "auth-choose-page" %}
{% block content %}

<section class="auth-card glass" style="max-width:560px;margin:64px auto;padding:28px">
  <!-- اللوقو -->
  <div class="logo" style="text-align:center;margin-bottom:12px">
    <img src="{{ url_for('static',filename='logonum1.png') }}" alt="logo"
         class="logo_ring" style="width:74px;height:74px;border-radius:50%">
  </div>

  <!-- العنوان -->
  <h2 class="title" style="text-align:center;margin:0 0 18px">إنشاء حساب جديد</h2>

  <!-- الرسائل (فلاش) -->
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      <div class="flash-stack" style="margin-bottom:10px">
        {% for cat, msg in messages %}
          <div class="flash {{ cat }}">{{ msg }}</div>
        {% endfor %}
      </div>
    {% endif %}
  {% endwith %}

  <!-- النموذج -->
   <!-- signup_customer.html -->
<form method="post" action="{{ url_for('customer_signup') }}" novalidate style="display:grid;gap:12px" autocomplete="off">
    <label>الاسم الكامل
      <input type="text"     name="full_name"         required class="input" placeholder="اكتب اسمك الكامل">
    </label>

    <label>البريد الإلكتروني
     <input type="email"    name="email"             required class="input" placeholder="name@example.com">
    </label>

    <label>كلمة المرور
      <input type="password" name="password"          required class="input" placeholder="••••••••">
    </label>

    <label>تأكيد كلمة المرور
      <input type="password" name="confirm_password"  required class="input" placeholder="تأكيد كلمة المرور">
    </label>

    <!-- الأزرار -->
    <div class="form-buttons" style="display:flex;gap:12px;justify-content:flex-end">
      <a href="{{ url_for('customer_login') }}" class="btn-back">رجوع</a>
      <button type="submit" class="btn-submit">تسجيل</button>
    </div>
  </form>
</section>
{% endblock %}
