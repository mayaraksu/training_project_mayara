<script>
(function(){
  const form = document.getElementById('addForm');
  const typeSel = document.getElementById('req_type');
  const distSel = document.getElementById('district_select');
  const distOther = document.getElementById('district_other');
  const distFinal = document.getElementById('district_final');
  const titleHidden = document.getElementById('titleHidden');

  // تبديل حقل "أخرى"
  distSel.addEventListener('change', ()=>{
    if(distSel.value === 'other'){
      distOther.style.display = 'block';
      distOther.focus();
    } else {
      distOther.style.display = 'none';
      distOther.value = '';
    }
    updateDistrict();
  });

  distOther.addEventListener('input', updateDistrict);

  function updateDistrict(){
    let val = distSel.value;
    if(val === 'other') val = distOther.value.trim();
    distFinal.value = val;
    buildTitle();
  }

  function buildTitle(){
    const t = typeSel.value.trim();
    const d = distFinal.value.trim();
    titleHidden.value = (t && d) ? ${t} - حي ${d} : (t || d);
  }

  typeSel.addEventListener('change', buildTitle);

  form.addEventListener('submit', (e)=>{
    updateDistrict();
    if(!typeSel.value || !distFinal.value){
      e.preventDefault();
      alert('الرجاء اختيار نوع الطلب والحي.');
    }
  });
})();
</script>
