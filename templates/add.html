{% extends "base.html" %}
{% block content %}
  <h2 style="text-align:center;margin:0 0 18px">إضافة طلب</h2>

  <div class="card">
    <form method="post" class="form-grid">

      <div>
        <label>رقم الطلب</label>
        <input type="text" name="req_number" placeholder="مثال: 1001"
               value="{{ form.req_number or '' }}">
      </div>

      <div>
        <label>العنوان <span class="req-star">*</span></label>
        <input type="text" name="title" placeholder="عنوان موجز للطلب" required
               value="{{ form.title or '' }}">
      </div>

      <div>
        <label>نوع الطلب</label>
        <select name="req_type">
          <option value="">— اختر —</option>
          {% for rt in req_types %}
            <option value="{{ rt }}" {% if form.req_type==rt %}selected{% endif %}>{{ rt }}</option>
          {% endfor %}
        </select>
      </div>

      <div>
        <label>الحي</label>
        <input type="text" name="district" placeholder="مثل: حي الياسمين"
               value="{{ form.district or '' }}">
      </div>

      <div>
        <label>الحالة</label>
        <select name="req_status">
          {% for s in req_statuses %}
            <option value="{{ s }}" {% if form.req_status==s %}selected{% endif %}>
              {{ 'معلّقة' if s=='pending'
                 else 'قيد المراجعة' if s=='under_review'
                 else 'مقبولة' if s=='approved'
                 else 'مرفوضة' }}
            </option>
          {% endfor %}
        </select>
      </div>

      <div style="grid-column:1/-1;display:flex;gap:10px;margin-top:8px">
        <button type="submit" class="btn-green">حفظ</button>
        <a class="btn-red" href="{{ url_for('dashboard') }}">إلغاء</a>
      </div>
    </form>
  </div>

  <p style="color:var(--muted);margin-top:10px">
    * بعد الحفظ ستتحدّث لوحة “الرئيسية” تلقائيًا، وستظهر القيم في الرسوم البيانية.
  </p>
{% endblock %}
