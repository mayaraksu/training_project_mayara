{% extends "base.html" %}
{% block content %}

<h2 style="text-align:center;margin:8px 0 14px">لوحة المسؤول</h2>

<!-- الإحصائيات السريعة -->
<div class="card" style="max-width:980px;margin:0 auto 12px">
  <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:12px">
    <div class="card" style="margin:0;text-align:center;padding:10px">
      <div style="font-size:12px;color:var(--muted)">إجمالي الطلبات</div>
      <div style="font-weight:700;font-size:20px">{{ counters.total or 0 }}</div>
    </div>
    <div class="card" style="margin:0;text-align:center;padding:10px">
      <div style="font-size:12px;color:var(--muted)">المقبولة</div>
      <div style="font-weight:700;font-size:20px">{{ counters.approved or 0 }}</div>
    </div>
    <div class="card" style="margin:0;text-align:center;padding:10px">
      <div style="font-size:12px;color:var(--muted)">قيد المراجعة</div>
      <div style="font-weight:700;font-size:20px">{{ counters.pending or 0 }}</div>
    </div>
    <div class="card" style="margin:0;text-align:center;padding:10px">
      <div style="font-size:12px;color:var(--muted)">المرفوضة</div>
      <div style="font-weight:700;font-size:20px">{{ counters.rejected or 0 }}</div>
    </div>
  </div>
</div>

<!-- الرسم البياني -->
<div class="card" style="max-width:980px;margin:0 auto 12px;padding:12px">
  <h3 style="margin:0 0 10px">الطلبات عبر الأشهر</h3>
  <canvas id="ordersChart" height="120"></canvas>
</div>

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1"></script>
<script>
const ctx = document.getElementById('ordersChart');
new Chart(ctx, {
  type: 'line',
  data: {
    labels: {{ chart_labels|default([])|tojson }},
    datasets: [{
      label: 'عدد الطلبات',
      data: {{ chart_data|default([])|tojson }},
      tension: .25,
      fill: false
    }]
  },
  options: {
    plugins: { legend: { display:false } },
    scales: {
      x: { grid: { display:false } },
      y: { beginAtZero:true, grid: { color:'rgba(0,0,0,.05)' } }
    }
  }
});
</script>

{% endblock %}
