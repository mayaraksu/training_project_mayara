{% extends "base.html" %}
{% block content %}

<style>
  .cards-wrap{
    max-width: 1080px;
    margin: 8px auto 18px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }
  .card{
    background:#fff;
    border:1px solid #e5e7eb;
    border-radius:12px;
    padding:18px;
    min-height:240px;
  }
  .card h3{
    margin:0 0 12px;
    font-size:16px;
  }
  .donut-box{
    min-height:240px;
    display:grid;
    place-items:center;
  }

  /* مربعات “آخر الطلبات” */
  .mini-grid{
    display:grid;
    grid-template-columns: repeat(2, 1fr);
    gap:14px;
  }
  .mini-card{
    border:1px solid #e5e7eb;
    border-radius:10px;
    padding:12px;
    text-align:center;
    background:#fff;
  }
  .mini-card-head{ color:#6b7280; font-size:13px; margin-bottom:6px }
  .mini-card-value{ font-weight:700; font-size:20px }

  /* وسائط صغيرة */
  @media (max-width: 900px){
    .cards-wrap{ grid-template-columns: 1fr; }
  }
</style>

<div class="cards-wrap">

  <!-- توزيع الحالات -->
  <div class="card">
    <h3>توزيع الحالات</h3>
    <div class="donut-box">
      <canvas id="statusDonut" width="280" height="280"></canvas>
    </div>
  </div>

  <!-- آخر الطلبات -->
  <div class="card">
    <h3>آخر الطلبات</h3>

    <div class="mini-grid">
      <!-- إجمالي الطلبات = قيد المراجعة -->
      <div class="mini-card">
        <div class="mini-card-head">إجمالي الطلبات</div>
        <div class="mini-card-value">{{ counts.under_review or 0 }}</div>
      </div>

      <div class="mini-card">
        <div class="mini-card-head">قيد المراجعة</div>
        <div class="mini-card-value">{{ counts.under_review or 0 }}</div>
      </div>

      <div class="mini-card">
        <div class="mini-card-head">مقبولة</div>
        <div class="mini-card-value">{{ counts.approved or 0 }}</div>
      </div>

      <div class="mini-card">
        <div class="mini-card-head">مرفوضة</div>
        <div class="mini-card-value">{{ counts.rejected or 0 }}</div>
      </div>
    </div>
  </div>
</div>

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script>
  (function () {
    const u = {{ counts.under_review or 0 }};
    const a = {{ counts.approved or 0 }};
    const r = {{ counts.rejected or 0 }};

    const ctx = document.getElementById('statusDonut');
    if (!ctx) return;

    new Chart(ctx, {
      type: 'doughnut',
      data: {
        labels: ['قيد المراجعة','مقبولة','مرفوضة'],
        datasets: [{
          data: [u, a, r],
          // ألوان: برتقالي، أخضر، أحمر
          backgroundColor: ['#f59e0b', '#16a34a', '#dc2626'],
          borderColor: ['#ffffff','#ffffff','#ffffff'],
          borderWidth: 2
        }]
      },
      options: {
        responsive: true,
        cutout: '60%',
        plugins: {
          legend: {
            position: 'bottom',
            labels: { usePointStyle: true, boxWidth: 8 }
          },
          tooltip: { rtl: true, bodyFont: { family: 'system-ui' } }
        }
      }
    });
  })();
</script>



{% include 'partials_footer_customer.html' %}
{% endblock %}
