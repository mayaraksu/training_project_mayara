{% extends "base.html" %}
{% set body_class = "admin-page" %}

{% block content %}
<main style="max-width:980px;margin:28px auto;padding:0 12px">
  <header style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
    <h2>مرحباً {{ session.get('admin_name') or 'مسؤول' }}</h2>
    <a class="btn" href="{{ url_for('admin_logout') }}">تسجيل الخروج</a>
  </header>

  <section class="auth-card glass" style="padding:18px">
    <p>هنا راح تكون لوحة تحكم المسؤول. لاحقًا نضيف الإحصائيات والطلبات..</p>
  </section>
</main>
{% endblock %}
