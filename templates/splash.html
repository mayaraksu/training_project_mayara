{% extends "base.html" %}
{% set is_auth = True %}          {# يخفي الشريط العلوي #}
{% set body_class = "splash-page" %}

{% block content %}
<style>
  .splash-wrap{
    min-height: calc(100vh - 0px);
    display: grid;
    place-items: center;
    padding: 32px 16px;
  }
  .splash-card{
    text-align: center;
  }
  .splash-card img{ width: 260px; height: 260px; display:block; margin: 0 auto 16px; }
  .splash-title{ font-weight: 700; font-size: 22px; margin: 0 0 6px; color:#0f5f28; }
  .splash-sub{ color:#666; font-size:14px; }
</style>

<div class="splash-wrap">
  <div class="splash-card">
    <img src="{{ url_for('static', filename='logonum1.png') }}" alt="شعار">
    <div class="splash-title">وزارة البيئة والمياه والزراعة</div>
    <div class="splash-sub">نظام إدارة فحوص المياه</div>
  </div>
</div>

<script>
  // تحويل تلقائي لصفحة اختيار نوع الدخول بعد ثانيتين
  setTimeout(function () {
    window.location.href = "{{ url_for('auth_choose') }}";
  }, 2000);
</script>
{% endblock %}
