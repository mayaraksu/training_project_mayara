{% extends "base.html" %}
{% set body_class = "splash-page" %}

{% block content %}
<style>
  .splash-wrap{min-height:calc(100vh - 140px);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:18px;text-align:center}
  .splash-logo{width:120px;height:120px;object-fit:contain}
  .splash-title{font-size:20px;font-weight:700}
  .splash-sub{color:#666}
  .spinner{width:34px;height:34px;border-radius:50%;border:3px solid #e5e5e5;border-top-color:#166534;animation:spin 0.9s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>

<div class="splash-wrap">
  <img src="{{ url_for('static', filename='logo7.png') }}" alt="شعار" class="splash-logo">
  <div class="splash-title">وزارة البيئة والمياه والزراعة</div>
  <div class="splash-sub">جارٍ التحميل…</div>
  <div class="spinner" aria-hidden="true"></div>

  <noscript>
    <p style="margin-top:12px">
      الجافاسكربت معطل — <a href="{{ url_for('auth_choose') }}">اضغط للمتابعة</a>
    </p>
  </noscript>
</div>

<script>
  // تحويل تلقائي بعد 1500ms
  setTimeout(function(){
    window.location.href = "{{ url_for('auth_choose') }}";
  }, 1500);
</script>
{% endblock %}
