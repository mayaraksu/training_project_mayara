{% extends "base.html" %}
{% set is_auth = True %}
{% set body_class = "auth-choose-page" %}
{% if is_auth %}{% include "partials_footer_auth.html" %}{% endif %}
{% block content %}

<style>
  /* الخلفية */
  body.auth-choose-page{
    background:
        linear-gradient(rgba(255,255,255,0.99), rgba(255,255,255,0.70)), /* طبقة بيضاء نصف شفافة */
        url("{{ url_for('static', filename='backg.png') }}") center/cover no-repeat;
    min-height: 100vh;
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
}

  /* تمركز المحتوى */
  .auth-wrap{
    min-height: calc(100dvh - 20px);
    display: grid;
    place-items: center;
    padding: 24px 16px;
  }

  /* الكارد */
  .auth-card{
    position: relative;
    width: min(640px, 92vw);
    background: rgba(255,255,255,.88);
    border: 1px solid rgba(0,0,0,.08);
    border-radius: 18px;
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
    padding: 64px 24px 24px; /* مساحة أعلى للشعار */
    box-shadow: 0 20px 40px rgba(0,0,0,.08);
  }

  /* الشعار نصف داخل/خارج */
  .logo-badge{
    position: absolute;
    top: -55px;                 /* يطلع نصفه برا */
    left: 50%;
    transform: translateX(-50%);
    width: 110px;
    height: 110x;
    border-radius: 50%;
    background: #fff;
    display: grid;
    place-items: center;
    box-shadow: 0 8px 24px rgba(0,0,0,.12);
  }
  .logo-badge img{width:90px;height:90px;object-fit:contain}

  .auth-title{
    text-align:center;
    font-weight:800;
    font-size: 28px;
    margin: 0 0 18px;
  }

  /* الأزرار */
  .actions{
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-top: 8px;
  }
  .btn{
    display:block;
    padding: 12px 16px;
    text-align:center;
    border-radius: 10px;
    border: 1px solid #166534;   /* نفس أخضر الوزارة */
    text-decoration:none;
    font-weight:700;
    background:#fff;
    color:#166534;
  }
  .btn-primary{ background:#166534; color:#fff; border-color:#166534 }
  .hint{
    text-align:center;
    margin-top: 10px;
    color:#555;
    font-size: 14px;
  }

  @media (max-width: 560px){
    .actions{ grid-template-columns: 1fr; }
  }
</style>

    <!-- الشعار -->
    <section class="auth-card glass"
         style="max-width:560px;margin:64px auto;padding:28px;position:relative;overflow:visible;">
  <div class="logo"
       style="position:absolute;top:-38px;left:50%;
              transform:translateX(-50%);
              background:#fff;border-radius:50%;
              padding:4px;">
    <img src="{{ url_for('static',filename='logonum1.png') }}"
         alt="logo"
         style="width:100px;height:100px;border-radius:50%;">
  </div>



    <h2 class="auth-title" style="margin-top:48px">اختيار نوع الدخول</h2>

    <div class="actions">
      <a href="{{ url_for('admin_login') }}" class="btn btn-primary">دخول المسؤولين</a>
      <a href="{{ url_for('customer_login') }}" class="btn">دخول العملاء</a>
    </div>

    <div class="hint">
      عميل جديد؟ <a href="{{ url_for('customer_signup') }}">أنشئ حسابًا</a>
    </div>
  </section>
</div>

{% endblock %}
