{% extends "base.html" %}
{% set body_class = "auth-choose-page" %}
{% block content %}

<style>
  /* تنسيقات خفيفة خاصة بهذه الصفحة فقط */
  .auth-wrap{display:grid;place-items:center;min-height:calc(100vh - 220px);padding:24px}
  .auth-card{width:min(560px,94vw);background:#fff;border:1px solid rgba(0,0,0,.08);
             border-radius:16px;padding:28px 22px;box-shadow:0 24px 48px rgba(16,24,40,.08);text-align:center}
  .logo-ring{width:84px;height:84px;margin:0 auto 14px;display:block}
  .auth-title{font-size:22px;margin:2px 0 18px}
  .actions{display:flex;gap:12px;justify-content:center;margin-top:10px}
  .btn{padding:10px 16px;border:none;border-radius:8px;cursor:pointer}
  .btn-primary{background:#166534;color:#fff}
  .btn-ghost{background:#fff;color:#166534;border:1px solid #166534}
  .hint{margin-top:14px;font-size:13px;color:#666}
  @media (max-width:520px){.actions{flex-direction:column}}
</style>

<div class="auth-wrap">
  <section class="auth-card">
    <img src="{{ url_for('static', filename='logonum1.png') }}" alt="Logo" class="logo-ring">
    <h2 class="auth-title">اختيار نوع الدخول</h2>

    <div class="actions">
      <a href="{{ url_for('customer_login') }}" class="btn btn-ghost">دخول العملاء</a>
      <a href="{{ url_for('admin_login') }}" class="btn btn-primary">دخول المسؤولين</a>
    </div>

    <p class="hint">ليس لديك حساب؟ <a href="{{ url_for('customer_signup') }}">إنشاء حساب جديد</a></p>
  </section>
</div>

{% endblock %}
