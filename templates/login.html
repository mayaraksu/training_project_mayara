<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>دخول المسؤول</title>
    <link rel="stylesheet"   href="{{url_for('static',filename='style-login.css')}}">
  <style>
    :root{
      --bg:#f6f8fb;
      --card:#ffffff;
      --text:#0f172a;
      --muted:#6b7280;
      --primary:#0ea5e9;      /* سماوي */
      --primary-hover:#0284c7;
      --green:#16a34a;         /* زر الدخول أخضر */
      --green-hover:#15803d;
      --border:#e5e7eb;
      --shadow:0 8px 30px rgba(2,8,23,.08);
      --radius:14px;
      --input:#ffffff;
    }
    html,body{
      height:100%;
      margin:0;
      background:var(--bg);
      color:var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Kufi Arabic", Tahoma, Arial, sans-serif;
    }
    .wrap{
      min-height:100%;
      display:flex;
      align-items:center;      /* بالنص عمودي */
      justify-content:center;  /* بالنص أفقي */
      padding:32px 16px;
    }
    .card{
      width:100%;
      max-width:520px;
      background:var(--card);
      border:1px solid var(--border);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      padding:26px 22px 20px;
    }
    .brand{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      margin-bottom:10px;
    }
    .brand img{
      width:72px;
      height:auto;
      display:block;
    }
    h1{
      text-align:center;
      margin:4px 0 14px;
      font-size:26px;
    }
    .field{
      margin:10px 0 14px;
    }
    label{
      display:block;
      font-size:14px;
      color:var(--muted);
      margin-bottom:6px;
    }
    input[type="email"],
    input[type="password"]{
      width:100%;
      padding:12px 14px;
      background:var(--input);
      color:var(--text);
      border:1px solid var(--border);
      border-radius:10px;
      outline:none;
      transition:border .15s ease-in-out, box-shadow .15s;
    }
    input:focus{
      border-color:var(--primary);
      box-shadow:0 0 0 3px rgba(14,165,233,.15);
    }
    .actions{
      display:flex;
      gap:10px;
      align-items:center;
      justify-content:flex-end;
      margin-top:6px;
    }
    .btn{
      display:inline-block;
      padding:12px 18px;
      border-radius:10px;
      border:1px solid transparent;
      cursor:pointer;
      font-size:16px;
      transition:.16s ease-in-out;
      text-decoration:none;
      text-align:center;
      min-width:120px;
    }
    .btn-green{ background:var(--green); color:#fff; }
    .btn-green:hover{ background:var(--green-hover); }
    .btn-ghost{
      background:#fff;
      color:#b91c1c;
      border:1px solid #ef4444;
    }
    .btn-ghost:hover{
      background:#fee2e2;
    }
    .footer{
      text-align:center;
      margin-top:12px;
      font-size:12px;
      color:var(--muted);
    }
    /* رسائل فلاش (إن وُجدت) */
    .flash{
      padding:10px 12px;
      border-radius:10px;
      margin:6px 0 10px;
      font-size:14px;
    }
    .flash.ok{ background:#ecfdf5; color:#065f46; border:1px solid #a7f3d0; }
    .flash.bad{ background:#fef2f2; color:#991b1b; border:1px solid #fecaca; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">

      <!-- شعار الوزارة فوق الصندوق -->
      <div class="brand">
        <img src="{{ url_for('static', filename='logo6.png') }}" alt="شعار الوزارة">
      </div>

      <h1>دخول المسؤول</h1>

      <!-- رسائل فلاش (اختياري) -->
      {% with msgs = get_flashed_messages(with_categories=True) %}
        {% if msgs %}
          {% for cat, m in msgs %}
            <div class="flash {{ 'ok' if cat=='ok' else 'bad' }}">{{ m }}</div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      <form method="post" action="{{ url_for('admin_login') }}">
        <div class="field">
          <label for="email">الإيميل</label>
          <input id="email" name="email" type="email" placeholder="admin@example.com" required>
        </div>
        <div class="field">
          <label for="password">كلمة المرور</label>
<input id="password" name="password" type="password" placeholder="••••••••" required>
        </div>

        <div class="actions">
          <a class="btn btn-ghost" href="{{ url_for('auth_choose') }}">رجوع</a>
          <button class="btn btn-green" type="submit">دخول المسؤولين</button>
        </div>
      </form>

      <div class="footer">© وزارة البيئة والمياه والزراعة 2025</div>
    </div>
  </div>
</body>
</html>
